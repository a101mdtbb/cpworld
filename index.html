<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Wiki de Amigos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Nuestra wiki compartida">
  <meta name="color-scheme" content="dark light">

  <!-- Tema base de Docsify (los estilos de abajo lo personalizan) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- Fuentes (puedes cambiarlas en CONFIG de CSS más abajo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       COLORES Y ESTILO  (cambia estos valores a tu gusto)
       ========================================================== */
    :root,
    :root[data-theme="dark"] {
      --bg:        #0e1116;   /* fondo principal */
      --bg-soft:   #151a21;   /* barra lateral y tarjetas */
      --bg-code:   #1b212a;   /* bloques de código */
      --border:    #28303b;   /* líneas */
      --text:      #e4e9f0;   /* texto */
      --text-soft: #8d99a8;   /* texto secundario */
      --accent:    #5eb5c9;   /* color de enlaces y acentos */
      --accent-bg: rgba(94, 181, 201, .12);
      --radius:    10px;
      --font:      'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }
    :root[data-theme="light"] {
      --bg:        #ffffff;
      --bg-soft:   #f5f7fa;
      --bg-code:   #eef1f5;
      --border:    #dde3ea;
      --text:      #1c232c;
      --text-soft: #5d6a7a;
      --accent:    #0d7f99;
      --accent-bg: rgba(13, 127, 153, .10);
    }

    html { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--accent-bg); }

    /* ---------- Barra lateral ---------- */
    .sidebar {
      background: var(--bg-soft);
      border-right: 1px solid var(--border);
      color: var(--text);
    }
    .sidebar .app-name-link, .sidebar .app-name-link:hover { color: var(--text); font-weight: 700; }
    .sidebar ul li a { color: var(--text-soft); font-weight: 500; border-radius: 6px; transition: color .15s, background .15s; }
    .sidebar ul li a:hover { color: var(--text); text-decoration: none; }
    .sidebar ul li.active > a { color: var(--accent); border-right: 0; font-weight: 600; background: var(--accent-bg); }
    .sidebar-toggle { background: transparent; }
    .sidebar-toggle span { background-color: var(--accent); }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ---------- Buscador ---------- */
    .sidebar .search { border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    .sidebar .search input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-family: var(--font);
      transition: border-color .15s;
    }
    .sidebar .search input:focus { border-color: var(--accent); outline: none; }
    .sidebar .search .results-panel { color: var(--text); }
    .sidebar .search .matching-post { border-bottom: 1px solid var(--border); }
    .sidebar .search .matching-post h2 { color: var(--text); }
    .sidebar .search .matching-post p { color: var(--text-soft); }
    .sidebar .search a:hover { text-decoration: none; }
    .sidebar .search .search-keyword { color: var(--accent); background: var(--accent-bg); font-style: normal; font-weight: 700; }
    .sidebar .search p.empty { color: var(--text-soft); }
    .sidebar .search .clear-button svg { stroke: var(--text-soft); }

    /* ---------- Contenido ---------- */
    .content { background: var(--bg); }
    .markdown-section { color: var(--text); max-width: 820px; line-height: 1.75; font-size: 16px; }
    .markdown-section h1, .markdown-section h2,
    .markdown-section h3, .markdown-section h4 { color: var(--text); font-weight: 700; letter-spacing: -.01em; }
    .markdown-section h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    .markdown-section a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .markdown-section a:hover { text-decoration: underline; }
    .markdown-section strong { color: var(--text); }
    .markdown-section hr { border-bottom: 1px solid var(--border); }
    .markdown-section img { border-radius: var(--radius); max-width: 100%; }

    .markdown-section blockquote {
      background: var(--bg-soft);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--text-soft);
      padding: .6em 1.2em;
      margin: 1.5em 0;
    }

    /* Código */
    .markdown-section code {
      background: var(--bg-code);
      color: var(--accent);
      border-radius: 5px;
      padding: .15em .4em;
      font-family: var(--font-mono);
      font-size: .88em;
    }
    .markdown-section pre {
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .markdown-section pre > code { background: transparent; color: var(--text); padding: 1em 1.2em; }
    .token.comment, .token.prolog, .token.doctype { color: #6b7787; }
    .token.keyword, .token.selector, .token.tag { color: #c792ea; }
    .token.string, .token.attr-value { color: #9fd98d; }
    .token.number, .token.boolean, .token.constant { color: #f2a96d; }
    .token.function, .token.class-name { color: #7cb7ff; }
    .token.punctuation, .token.operator { color: var(--text-soft); }

    /* Tablas */
    .markdown-section table { display: table; width: 100%; border-collapse: collapse; border-radius: var(--radius); overflow: hidden; }
    .markdown-section th { background: var(--bg-soft); color: var(--text); border: 1px solid var(--border); }
    .markdown-section td { border: 1px solid var(--border); }
    .markdown-section tr { background: transparent; border: 0; }
    .markdown-section tr:nth-child(2n) { background: var(--bg-soft); }

    /* Mensajes de ayuda (!> y ?>) */
    .markdown-section p.tip, .markdown-section p.warn {
      background: var(--bg-soft);
      border-radius: var(--radius);
      border-left: 4px solid var(--accent);
      color: var(--text);
    }
    .markdown-section p.warn { border-left-color: #e5a550; }
    .markdown-section p.tip:before { background: var(--accent); color: var(--bg); }
    .markdown-section p.warn:before { background: #e5a550; color: var(--bg); }

    /* Paginación (anterior / siguiente) */
    .docsify-pagination-container { border-top: 1px solid var(--border) !important; margin-top: 3em !important; }
    .pagination-item a, .pagination-item a:hover { color: var(--text) !important; text-decoration: none; }
    .pagination-item-label { color: var(--text-soft) !important; }
    .pagination-item-title { color: var(--accent) !important; }

    /* Botón copiar código */
    .docsify-copy-code-button {
      background: var(--bg-soft) !important;
      color: var(--text-soft) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
    }

    /* Zoom de imágenes */
    .medium-zoom-overlay { background: var(--bg) !important; }

    /* Pie de página */
    .wiki-footer {
      margin-top: 3em;
      padding-top: 1.2em;
      border-top: 1px solid var(--border);
      color: var(--text-soft);
      font-size: .85em;
    }

    /* Botón modo claro/oscuro */
    #theme-toggle {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 30;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      transition: border-color .15s;
    }
    #theme-toggle:hover, #theme-toggle:focus-visible { border-color: var(--accent); outline: none; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Cambiar tema">☀️</button>
  <div id="app">Cargando wiki...</div>

  <!-- Debe cargarse antes de la configuración -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-edit-on-github"></script>

  <script>
    /* ==========================================================
       CONFIGURACIÓN  (lo único que DEBES cambiar es usuario y repo)
       ========================================================== */
    const CONFIG = {
      nombre:    'Wiki de Amigos',
      usuario:   'TU-USUARIO',      // tu usuario de GitHub
      repo:      'wiki-amigos',     // nombre de tu repositorio
      rama:      'main',            // rama principal
      temaInicial: 'dark',          // 'dark' o 'light'
      textoEditar: '✏️ Editar esta página',
      pie: 'Hecha entre amigos. Cualquiera con acceso puede editarla.'
    };

    /* ---------- Modo claro / oscuro (se recuerda la elección) ---------- */
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var guardado = null;
      try { guardado = localStorage.getItem('wiki-tema'); } catch (e) {}
      function aplicar(t) {
        root.setAttribute('data-theme', t);
        btn.textContent = t === 'dark' ? '☀️' : '🌙';
      }
      aplicar(guardado || CONFIG.temaInicial);
      btn.addEventListener('click', function () {
        var nuevo = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        aplicar(nuevo);
        try { localStorage.setItem('wiki-tema', nuevo); } catch (e) {}
      });
    })();

    /* ---------- Pie de página en cada página ---------- */
    function pieDePagina(hook) {
      hook.afterEach(function (html) {
        return html + '<div class="wiki-footer">' + CONFIG.pie + '</div>';
      });
    }

    /* ---------- Docsify ---------- */
    window.$docsify = {
      name: CONFIG.nombre,
      repo: '',                    // pon 'usuario/repo' para mostrar la esquina de GitHub
      homepage: 'README.md',
      loadSidebar: 'sidebar.md',   // menú lateral
      maxLevel: 3,
      subMaxLevel: 2,              // títulos de cada página dentro del menú
      auto2top: true,              // sube al inicio al cambiar de página
      notFoundPage: true,
      themeColor: '#5eb5c9',

      search: {
        placeholder: 'Buscar en la wiki...',
        noData: 'Sin resultados',
        depth: 3,
        paths: 'auto',
        hideOtherSidebarContent: false
      },

      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Error',
        successText: '¡Copiado!'
      },

      pagination: {
        previousText: 'Anterior',
        nextText: 'Siguiente',
        crossChapter: true,
        crossChapterText: true
      },

      plugins: [
        pieDePagina,
        EditOnGithubPlugin.create(
          'https://github.com/' + CONFIG.usuario + '/' + CONFIG.repo + '/blob/' + CONFIG.rama + '/',
          null,
          CONFIG.textoEditar
        )
      ]
    };
  </script>

  <!-- Docsify y plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

  <!-- Resaltado de código -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
