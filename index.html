<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Wiki de Amigos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       COLORES Y ESTILO (cambia lo que quieras)
       ========================================================== */
    :root, :root[data-theme="dark"] {
      --bg:#0e1116; --bg-soft:#151a21; --bg-code:#1b212a; --border:#28303b;
      --text:#e4e9f0; --text-soft:#8d99a8; --accent:#5eb5c9; --accent-bg:rgba(94,181,201,.12);
      --danger:#e07a7a; --radius:10px;
      --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
      --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    }
    :root[data-theme="light"] {
      --bg:#fff; --bg-soft:#f5f7fa; --bg-code:#eef1f5; --border:#dde3ea;
      --text:#1c232c; --text-soft:#5d6a7a; --accent:#0d7f99; --accent-bg:rgba(13,127,153,.10);
      --danger:#c0392b;
    }
    html { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
      -webkit-font-smoothing: antialiased; display: grid; grid-template-columns: 300px minmax(0,1fr); min-height: 100vh;
    }
    ::selection { background: var(--accent-bg); }
    a { color: var(--accent); }
    button, input, textarea { font-family: inherit; font-size: 15px; color: var(--text); }

    /* ---------- Botones y campos ---------- */
    .btn {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 14px; cursor: pointer; font-weight: 500; transition: border-color .15s, background .15s;
    }
    .btn:hover, .btn:focus-visible { border-color: var(--accent); outline: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
    .btn.danger { color: var(--danger); }
    .btn.danger:hover { border-color: var(--danger); }
    .btn.small { padding: 5px 10px; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: default; }
    .field {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
      transition: border-color .15s;
    }
    .field:focus { border-color: var(--accent); outline: none; }

    /* ---------- Barra lateral ---------- */
    .side {
      background: var(--bg-soft); border-right: 1px solid var(--border);
      height: 100vh; height: 100dvh; position: sticky; top: 0; display: flex; flex-direction: column; min-height: 0;
    }
    .side-head { padding: 20px 16px 10px; }
    .brand { font-weight: 700; font-size: 19px; letter-spacing: -.01em; color: var(--text); text-decoration: none; }
    .side-tools { padding: 8px 16px 10px; display: grid; gap: 8px; }
    #nav { flex: 1; overflow: auto; padding: 4px 10px 16px; }
    #nav details { margin-bottom: 4px; }
    #nav summary { cursor: pointer; padding: 7px 8px; font-weight: 600; font-size: 14px; color: var(--text-soft); border-radius: 6px; }
    #nav summary:hover { color: var(--text); }
    #nav a.item {
      display: block; padding: 6px 10px; margin: 1px 0; border-radius: 6px; text-decoration: none;
      color: var(--text-soft); font-weight: 500; font-size: 14.5px; transition: color .15s, background .15s;
    }
    #nav a.item:hover { color: var(--text); }
    #nav a.item.active { color: var(--accent); background: var(--accent-bg); font-weight: 600; }
    #nav .snippet { display: block; font-size: 12.5px; font-weight: 400; color: var(--text-soft); margin-top: 2px; }
    #nav .empty { padding: 10px; color: var(--text-soft); font-size: 14px; }
    .side-foot { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
    .side-foot .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-soft); }
    .who .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---------- Contenido ---------- */
    main { min-width: 0; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 44px 28px 100px; }
    .topbar { display: none; }
    .page-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 28px; }
    .page-head h1 { margin: 0; font-size: 2.1rem; letter-spacing: -.02em; line-height: 1.2; }
    .meta { color: var(--text-soft); font-size: 13.5px; margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .md { line-height: 1.75; font-size: 16px; overflow-wrap: anywhere; }
    .md h1, .md h2, .md h3, .md h4 { letter-spacing: -.01em; line-height: 1.3; margin: 1.6em 0 .6em; }
    .md h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    .md a { font-weight: 500; text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md img { max-width: 100%; border-radius: var(--radius); }
    .md blockquote { background: var(--bg-soft); border-left: 3px solid var(--accent); border-radius: 0 var(--radius) var(--radius) 0; color: var(--text-soft); padding: .5em 1.2em; margin: 1.4em 0; }
    .md code { background: var(--bg-code); color: var(--accent); border-radius: 5px; padding: .15em .4em; font-family: var(--font-mono); font-size: .88em; }
    .md pre { background: var(--bg-code); border: 1px solid var(--border); border-radius: var(--radius); padding: 1em 1.2em; overflow: auto; }
    .md pre code { background: transparent; color: var(--text); padding: 0; }
    .md table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    .md th, .md td { border: 1px solid var(--border); padding: 8px 12px; }
    .md th { background: var(--bg-soft); }
    .md hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }

    .card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
    .card h2 { margin-top: 0; }
    .card p { color: var(--text-soft); line-height: 1.6; }

    /* ---------- Editor ---------- */
    .editor { display: grid; gap: 14px; }
    .row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    label.lbl { display: grid; gap: 6px; font-size: 13.5px; color: var(--text-soft); font-weight: 500; }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .toolbar .sp { flex: 1; }
    .tab.on { border-color: var(--accent); color: var(--accent); }
    #f-body { min-height: 52vh; resize: vertical; font-family: var(--font-mono); font-size: 14px; line-height: 1.6; }
    .preview { min-height: 52vh; border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; }
    .drop { outline: 2px dashed var(--accent); outline-offset: -4px; }

    /* ---------- Ventana de acceso y avisos ---------- */
    dialog { background: var(--bg-soft); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 26px; width: min(380px, 92vw); }
    dialog::backdrop { background: rgba(0,0,0,.55); }
    dialog h2 { margin: 0 0 16px; }
    dialog form { display: grid; gap: 12px; }
    .err { color: var(--danger); font-size: 13.5px; min-height: 1.2em; margin: 0; }
    .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 13.5px; }
    #toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
      padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
    }
    #toast.show { opacity: 1; }
    .backdrop { display: none; }

    /* ---------- Fotos de perfil e historial ---------- */
    .avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; display: inline-grid; place-items: center; font-size: 13px; font-weight: 600; color: #fff; background: var(--accent); }
    .avatar.sm { width: 22px; height: 22px; font-size: 11px; }
    .avatar.lg { width: 72px; height: 72px; font-size: 28px; }
    .person { display: inline-flex; align-items: center; gap: 6px; }
    .avatar-row { display: flex; align-items: center; gap: 14px; }
    .history { margin-top: 3em; border-top: 1px solid var(--border); padding-top: 14px; }
    .history summary { cursor: pointer; color: var(--text-soft); font-size: 14px; font-weight: 500; }
    .history ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
    .history li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-soft); }
    .history li b { color: var(--text); font-weight: 600; }

    /* ---------- Móvil ---------- */
    @media (max-width: 820px) {
      body { grid-template-columns: minmax(0,1fr); }
      .side { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); z-index: 40; transform: translateX(-100%); transition: transform .2s; }
      body.menu .side { transform: none; }
      body.menu .backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 35; }
      .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 20; }
      .topbar strong { font-size: 16px; }
      .wrap { padding: 28px 18px 90px; }
      .page-head h1 { font-size: 1.7rem; }
      .row { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <aside class="side" id="side">
    <div class="side-head"><a class="brand" href="#/" id="brand">Wiki</a></div>
    <div class="side-tools">
      <input id="q" class="field" type="search" placeholder="Buscar (pulsa /)" autocomplete="off" aria-label="Buscar en la wiki">
      <button class="btn primary" id="btn-new" type="button">+ Nueva página</button>
    </div>
    <nav id="nav" aria-label="Páginas"></nav>
    <div class="side-foot">
      <span class="who" id="who"></span>
      <button class="btn small" id="btn-auth" type="button">Entrar</button>
      <button class="btn small" id="btn-theme" type="button" aria-label="Cambiar tema" title="Cambiar tema">☀️</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main>
    <div class="topbar">
      <button class="btn small" id="btn-menu" type="button" aria-label="Abrir menú">☰</button>
      <strong id="brand-m">Wiki</strong>
    </div>
    <div class="wrap" id="view">Cargando...</div>
  </main>

  <dialog id="auth">
    <h2 id="auth-title">¿Cómo te llamas?</h2>
    <form id="auth-form">
      <div class="avatar-row"><span id="a-prev"></span><button class="btn small" id="a-photo" type="button">Elegir foto (opcional)</button></div>
      <input id="a-name" class="field" type="text" placeholder="Tu nombre de usuario" autocomplete="nickname" minlength="2" maxlength="30" required>
      <p class="err" id="a-err"></p>
      <button class="btn primary" id="a-submit" type="submit">Entrar</button>
      <div style="display:flex;justify-content:flex-end">
        <button class="link" id="a-close" type="button">Cerrar</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <input type="file" id="file" multiple hidden>
  <input type="file" id="a-file" accept="image/*" hidden>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>

  <script>
  /* ==========================================================
     CONFIGURACIÓN
     ========================================================== */
  const CONFIG = {
    nombre: 'Wiki de Amigos',
    supabaseUrl: 'https://midmcamaakttttxtkhyv.supabase.co',
    supabaseKey: 'sb_publishable_FjfFUJaSZAN5GJ58mfGGJw_Hn7ZOj_q',
    bucket: 'imagenes',        // carpeta de archivos en Supabase
    paginaInicio: 'inicio',    // la página con este nombre es la portada
    temaInicial: 'dark'
  };

  const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
  const $ = (s) => document.querySelector(s);
  const RESERVADOS = ['nueva', 'editar'];
  let pages = [], perfiles = {}, user = null, listo = false, slugActual = '', borrador = null;

  /* ---------- Utilidades ---------- */
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }
  const norm = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const slugify = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'pagina';
  const fecha = (d) => new Date(d).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' });
  const nombreDe = (u) => u ? (u.user_metadata?.nombre || 'Anónimo') : '';
  let tt;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600);
  }

  const fechaHora = (d) => new Date(d).toLocaleString('es', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  function avatar(id, nombre, size) {
    const pr = perfiles[id] || {}, n = pr.nombre || nombre || '?';
    if (pr.avatar_url && /^https:\/\//.test(pr.avatar_url))
      return h('img', { class: 'avatar ' + (size || ''), src: pr.avatar_url, alt: n, loading: 'lazy' });
    let hue = 0; for (const c of String(id || n)) hue = (hue * 31 + c.charCodeAt(0)) % 360;
    return h('span', { class: 'avatar ' + (size || ''), style: 'background:hsl(' + hue + ' 45% 42%)' }, (n.trim().charAt(0) || '?').toUpperCase());
  }
  const nombrePerfil = (id, fallback) => (perfiles[id] && perfiles[id].nombre) || fallback || 'Alguien';
  const persona = (id, fallback, size) => h('span', { class: 'person' }, avatar(id, fallback, size), nombrePerfil(id, fallback));

  DOMPurify.addHook('afterSanitizeAttributes', (n) => {
    if (n.tagName === 'A' && /^https?:/i.test(n.getAttribute('href') || '')) {
      n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer');
    }
  });
  function mdToHtml(src) {
    const conEnlaces = (src || '').replace(/\[\[([^\]]+)\]\]/g, (m, t) => '[' + t + '](#/' + slugify(t) + ')');
    return DOMPurify.sanitize(marked.parse(conEnlaces, { breaks: true }), { ADD_ATTR: ['target'] });
  }

  /* ---------- Tema ---------- */
  (function () {
    const root = document.documentElement, btn = $('#btn-theme');
    let g = null; try { g = localStorage.getItem('wiki-tema'); } catch (e) {}
    const aplicar = (t) => { root.setAttribute('data-theme', t); btn.textContent = t === 'dark' ? '☀️' : '🌙'; };
    aplicar(g || CONFIG.temaInicial);
    btn.onclick = () => {
      const n = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      aplicar(n); try { localStorage.setItem('wiki-tema', n); } catch (e) {}
    };
  })();

  /* ---------- Datos ---------- */
  async function cargar() {
    const { data, error } = await sb.from('pages')
      .select('id,slug,title,category,content,author,author_id,editor_id,created_at,updated_at').order('title');
    if (error) { mostrarError(error); return false; }
    pages = data || [];
    const pr = await sb.from('profiles').select('id,nombre,avatar_url');
    perfiles = {}; (pr.data || []).forEach(x => { perfiles[x.id] = x; });
    return true;
  }
  function mostrarError(err) {
    $('#view').replaceChildren(h('div', { class: 'card' },
      h('h2', {}, 'No se pudo cargar la wiki'),
      h('p', {}, 'Mensaje: ' + (err.message || err)),
      h('p', {}, 'Si es la primera vez, revisa que ejecutaste el código SQL en Supabase (SQL Editor).')));
  }
  async function asegurarPerfil() {
    if (!user || perfiles[user.id]) return;
    const nombre = nombreDe(user);
    const { error } = await sb.from('profiles').upsert({ id: user.id, nombre });
    if (!error) perfiles[user.id] = { id: user.id, nombre, avatar_url: '' };
  }
  async function cargarHistorial(p, ul) {
    const { data, error } = await sb.from('page_history').select('user_id,action,created_at')
      .eq('page_id', p.id).order('created_at', { ascending: false }).limit(30);
    ul.replaceChildren();
    if (error) { ul.append(h('li', {}, 'No se pudo cargar el historial.')); return; }
    if (!data.length) { ul.append(h('li', {}, 'Sin registros todavía. Se guardan desde la próxima edición.')); return; }
    data.forEach(r => ul.append(h('li', {}, avatar(r.user_id, '', 'sm'),
      h('span', {}, h('b', {}, nombrePerfil(r.user_id)), ' ' + r.action + ' la página el ' + fechaHora(r.created_at)))));
  }
  function slugUnico(titulo) {
    let base = slugify(titulo), s = base, n = 2;
    while (RESERVADOS.includes(s) || pages.some(p => p.slug === s)) s = base + '-' + n++;
    return s;
  }

  /* ---------- Barra lateral ---------- */
  function renderNav() {
    const nav = $('#nav'); nav.replaceChildren();
    const q = norm($('#q').value.trim());
    const enlace = (p, extra) => h('a', { class: 'item' + (p.slug === slugActual ? ' active' : ''), href: '#/' + p.slug }, p.title, extra);

    if (q) {
      const hits = pages.filter(p => norm(p.title).includes(q) || norm(p.content).includes(q) || norm(p.category).includes(q));
      if (!hits.length) { nav.append(h('div', { class: 'empty' }, 'Sin resultados')); return; }
      hits.forEach(p => {
        let snip = '';
        const i = norm(p.content).indexOf(q);
        if (i >= 0) snip = (i > 30 ? '…' : '') + p.content.slice(Math.max(0, i - 30), i + 70).replace(/\s+/g, ' ');
        nav.append(enlace(p, snip ? h('span', { class: 'snippet' }, snip) : null));
      });
      return;
    }
    if (!pages.length) { nav.append(h('div', { class: 'empty' }, 'Aún no hay páginas.')); return; }

    const inicio = pages.find(p => p.slug === CONFIG.paginaInicio);
    if (inicio) nav.append(enlace(inicio));
    const grupos = {};
    pages.filter(p => p !== inicio).forEach(p => { (grupos[p.category || 'General'] ||= []).push(p); });
    Object.keys(grupos).sort((a, b) => a === 'General' ? -1 : b === 'General' ? 1 : a.localeCompare(b, 'es')).forEach(c => {
      nav.append(h('details', { open: true }, h('summary', {}, c), grupos[c].map(p => enlace(p))));
    });
  }

  /* ---------- Vistas ---------- */
  function irA(hash) { if (location.hash === hash) route(); else location.hash = hash; }

  function showPage(slug) {
    const p = pages.find(x => x.slug === slug);
    const v = $('#view'); v.replaceChildren();
    if (!p) {
      const esInicio = slug === CONFIG.paginaInicio || !slug;
      v.append(h('div', { class: 'card' },
        h('h2', {}, esInicio ? 'Bienvenido a ' + CONFIG.nombre : 'Esta página no existe'),
        h('p', {}, esInicio ? 'Todavía no hay portada. Crea la página de inicio para empezar.' : 'Puedes crearla ahora mismo.'),
        h('button', { class: 'btn primary', onclick: () => {
          if (!user) return abrirAuth();
          borrador = { slug: esInicio ? CONFIG.paginaInicio : slug, title: esInicio ? 'Inicio' : slug.replace(/-/g, ' ') };
          irA('#/nueva');
        } }, esInicio ? 'Crear la página de inicio' : 'Crear esta página')));
      return;
    }
    const soyAutor = user && p.author_id === user.id;
    const acciones = h('div', { class: 'actions' },
      user ? h('button', { class: 'btn', onclick: () => irA('#/editar/' + p.slug) }, 'Editar')
           : h('button', { class: 'btn', onclick: abrirAuth }, 'Poner mi nombre para editar'),
      soyAutor && h('button', { class: 'btn danger', onclick: () => borrar(p) }, 'Eliminar'));
    v.append(
      h('div', { class: 'page-head' },
        h('div', {}, h('h1', {}, p.title),
          h('div', { class: 'meta' }, p.category && h('span', {}, p.category),
            h('span', {}, 'Creada por ', persona(p.author_id, p.author, 'sm')), h('span', {}, 'Editada por ', persona(p.editor_id || p.author_id, p.author, 'sm'), ' el ' + fecha(p.updated_at)))),
        acciones),
      h('div', { class: 'md' }));
    v.querySelector('.md').innerHTML = mdToHtml(p.content);
    document.title = p.title + ' · ' + CONFIG.nombre;
    const lista = h('ul', {}, h('li', {}, 'Cargando...'));
    v.append(h('details', { class: 'history' }, h('summary', {}, 'Historial de cambios'), lista));
    cargarHistorial(p, lista);
  }

  function showEditor(page) {
    if (!user) { abrirAuth(); irA('#/' + (page ? page.slug : '')); return; }
    const d = page || borrador || {};
    const v = $('#view'); v.replaceChildren();
    const cats = [...new Set(pages.map(p => p.category).filter(Boolean))];
    const body = h('textarea', { class: 'field', id: 'f-body', placeholder: 'Escribe aquí. Usa [[Nombre de otra página]] para enlazar páginas.' });
    body.value = d.content || '';
    const prev = h('div', { class: 'preview md', hidden: true });
    const tW = h('button', { class: 'btn small tab on', type: 'button' }, 'Escribir');
    const tP = h('button', { class: 'btn small tab', type: 'button' }, 'Vista previa');
    tW.onclick = () => { tW.classList.add('on'); tP.classList.remove('on'); body.hidden = false; prev.hidden = true; };
    tP.onclick = () => { tP.classList.add('on'); tW.classList.remove('on'); prev.innerHTML = mdToHtml(body.value); body.hidden = true; prev.hidden = false; };

    const wrap = (a, b = a, ph = 'texto') => () => {
      const s = body.selectionStart, e = body.selectionEnd;
      body.setRangeText(a + (body.value.slice(s, e) || ph) + b, s, e, 'select'); body.focus();
    };
    const prefijo = (t) => () => {
      const s = body.selectionStart, i = body.value.lastIndexOf('\n', s - 1) + 1;
      body.setRangeText(t, i, i, 'end'); body.focus();
    };
    const boton = (txt, tip, fn) => h('button', { class: 'btn small', type: 'button', title: tip, onclick: fn }, txt);

    async function subirArchivos(files) {
      for (const f of files) {
        try {
          toast('Subiendo ' + f.name + '...');
          const url = await subir(f);
          const ins = f.type.startsWith('image/') ? '\n![' + f.name + '](' + url + ')\n' : '\n[📎 ' + f.name + '](' + url + ')\n';
          body.setRangeText(ins, body.selectionStart, body.selectionEnd, 'end');
          toast('Archivo subido');
        } catch (err) { toast('Error al subir: ' + (err.message || err)); }
      }
      body.focus();
    }
    $('#file').onchange = (e) => { subirArchivos([...e.target.files]); e.target.value = ''; };
    body.addEventListener('paste', (e) => {
      const f = [...(e.clipboardData?.files || [])]; if (f.length) { e.preventDefault(); subirArchivos(f); }
    });
    body.addEventListener('dragover', (e) => { e.preventDefault(); body.classList.add('drop'); });
    body.addEventListener('dragleave', () => body.classList.remove('drop'));
    body.addEventListener('drop', (e) => {
      e.preventDefault(); body.classList.remove('drop');
      const f = [...e.dataTransfer.files]; if (f.length) subirArchivos(f);
    });

    const guardarBtn = h('button', { class: 'btn primary', type: 'button' }, 'Guardar');
    guardarBtn.onclick = () => guardar(page, guardarBtn);

    v.append(h('div', { class: 'editor' },
      h('h1', { style: 'margin:0' }, page ? 'Editar página' : 'Nueva página'),
      h('div', { class: 'row' },
        h('label', { class: 'lbl' }, 'Título', h('input', { class: 'field', id: 'f-title', value: d.title || '', placeholder: 'Ej: Canciones favoritas' })),
        h('label', { class: 'lbl' }, 'Categoría (opcional)', h('input', { class: 'field', id: 'f-cat', value: d.category || '', list: 'cats', placeholder: 'Ej: Música' }),
          h('datalist', { id: 'cats' }, cats.map(c => h('option', { value: c }))))),
      h('div', { class: 'toolbar' }, tW, tP, h('span', { class: 'sp' }),
        boton('B', 'Negrita', wrap('**')), boton('I', 'Cursiva', wrap('*')), boton('Título', 'Título', prefijo('## ')),
        boton('Lista', 'Lista', prefijo('- ')), boton('Enlace', 'Enlace', wrap('[', '](https://)', 'texto')),
        boton('Código', 'Código', wrap('`')), boton('📎 Subir', 'Subir imagen o archivo', () => $('#file').click())),
      body, prev,
      h('div', { class: 'actions' }, guardarBtn,
        h('button', { class: 'btn', type: 'button', onclick: () => { borrador = null; irA('#/' + (page ? page.slug : '')); } }, 'Cancelar'))));
    $('#f-title').focus();
  }

  /* ---------- Acciones ---------- */
  async function subir(file) {
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
    const base = slugify(file.name.replace(/\.[^.]+$/, ''));
    const ruta = user.id + '/' + Date.now() + '-' + base + '.' + ext;
    const { error } = await sb.storage.from(CONFIG.bucket).upload(ruta, file, { contentType: file.type || undefined });
    if (error) throw error;
    return sb.storage.from(CONFIG.bucket).getPublicUrl(ruta).data.publicUrl;
  }

  async function guardar(page, btn) {
    const title = $('#f-title').value.trim(), category = $('#f-cat').value.trim(), content = $('#f-body').value;
    if (!title) { toast('Ponle un título a la página'); return; }
    btn.disabled = true;
    let slug, error;
    if (page) {
      slug = page.slug;
      ({ error } = await sb.from('pages').update({ title, category, content, editor_id: user.id, updated_at: new Date().toISOString() }).eq('id', page.id));
      if (!error) await sb.from('page_history').insert({ page_id: page.id, user_id: user.id, action: 'editó' });
    } else {
      slug = borrador?.slug && !pages.some(p => p.slug === borrador.slug) ? borrador.slug : slugUnico(title);
      const r = await sb.from('pages').insert({ slug, title, category, content, author: nombreDe(user), author_id: user.id, editor_id: user.id }).select('id').single();
      error = r.error;
      if (!error) await sb.from('page_history').insert({ page_id: r.data.id, user_id: user.id, action: 'creó' });
    }
    btn.disabled = false;
    if (error) { toast('Error: ' + error.message); return; }
    borrador = null; toast('Guardado');
    await cargar(); irA('#/' + slug);
  }

  async function borrar(p) {
    if (!confirm('¿Eliminar "' + p.title + '"? No se puede deshacer.')) return;
    const { error } = await sb.from('pages').delete().eq('id', p.id);
    if (error) { toast('Error: ' + error.message); return; }
    toast('Página eliminada'); await cargar(); irA('#/');
  }

  /* ---------- Perfil (nombre y foto) ---------- */
  let fotoPendiente = null;   // foto elegida; se sube al guardar
  function pintarVistaPrevia() {
    const box = $('#a-prev'); box.replaceChildren();
    if (fotoPendiente) box.append(h('img', { class: 'avatar lg', src: URL.createObjectURL(fotoPendiente), alt: 'Vista previa' }));
    else box.append(avatar(user && user.id, $('#a-name').value.trim() || (user ? nombreDe(user) : '?'), 'lg'));
  }
  function reducirImagen(file, lado = 256) {
    return new Promise((ok, fail) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const m = Math.min(img.width, img.height), c = document.createElement('canvas');
        c.width = c.height = lado;
        c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, lado, lado);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? ok(b) : fail(new Error('No se pudo procesar la imagen')), 'image/jpeg', 0.85);
      };
      img.onerror = () => fail(new Error('Esa imagen no se puede leer'));
      img.src = url;
    });
  }
  function abrirAuth() {
    fotoPendiente = null;
    $('#auth-title').textContent = user ? 'Tu perfil' : '¿Cómo te llamas?';
    $('#a-submit').textContent = user ? 'Guardar' : 'Entrar';
    $('#a-err').textContent = '';
    let guardado = '';
    try { guardado = localStorage.getItem('wiki-nombre') || ''; } catch (e) {}
    $('#a-name').value = user ? nombrePerfil(user.id, nombreDe(user)) : guardado;
    pintarVistaPrevia();
    $('#auth').showModal(); $('#a-name').focus(); $('#a-name').select();
  }
  $('#a-close').onclick = () => $('#auth').close();
  $('#a-photo').onclick = () => $('#a-file').click();
  $('#a-file').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) { fotoPendiente = f; pintarVistaPrevia(); } };
  $('#a-name').addEventListener('input', () => { if (!fotoPendiente) pintarVistaPrevia(); });

  $('#auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const nombre = $('#a-name').value.trim(), err = $('#a-err'), btn = $('#a-submit');
    if (nombre.length < 2) { err.textContent = 'Escribe al menos 2 letras.'; return; }
    err.textContent = ''; btn.disabled = true;
    const r = user ? await sb.auth.updateUser({ data: { nombre } })
                   : await sb.auth.signInAnonymously({ options: { data: { nombre } } });
    if (r.error) {
      btn.disabled = false;
      err.textContent = /anonymous/i.test(r.error.message)
        ? 'Falta activar "Allow anonymous sign-ins" en Supabase (Authentication → Sign In / Providers).'
        : r.error.message;
      return;
    }
    if (r.data.user) user = r.data.user;
    let avatar_url = (perfiles[user.id] && perfiles[user.id].avatar_url) || '', aviso = '';
    if (fotoPendiente) {
      try {
        const blob = await reducirImagen(fotoPendiente);
        const ruta = user.id + '/avatar-' + Date.now() + '.jpg';
        const up = await sb.storage.from(CONFIG.bucket).upload(ruta, blob, { contentType: 'image/jpeg' });
        if (up.error) throw up.error;
        avatar_url = sb.storage.from(CONFIG.bucket).getPublicUrl(ruta).data.publicUrl;
      } catch (e2) { aviso = ' (la foto falló: ' + (e2.message || e2) + ')'; }
    }
    const pf = await sb.from('profiles').upsert({ id: user.id, nombre, avatar_url, updated_at: new Date().toISOString() });
    btn.disabled = false;
    if (pf.error) { err.textContent = 'No se pudo guardar el perfil: ' + pf.error.message; return; }
    perfiles[user.id] = { id: user.id, nombre, avatar_url };
    try { localStorage.setItem('wiki-nombre', nombre); } catch (e3) {}
    setUser(user); route();
    $('#auth').close(); toast('Perfil guardado' + aviso);
  };
  function setUser(u) {
    user = u;
    const who = $('#who'); who.replaceChildren();
    if (u) who.append(avatar(u.id, nombreDe(u), 'sm'), h('span', { class: 'nm' }, nombrePerfil(u.id, nombreDe(u))));
    else who.append(h('span', { class: 'nm' }, 'Sin nombre'));
    const b = $('#btn-auth'); b.textContent = u ? 'Perfil' : 'Entrar';
    b.onclick = abrirAuth;
  }
  $('#btn-new').onclick = () => { if (!user) return abrirAuth(); borrador = null; irA('#/nueva'); };

  /* ---------- Rutas ---------- */
  function route() {
    if (!listo) return;
    const hsh = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    document.body.classList.remove('menu');
    document.title = CONFIG.nombre;
    if (hsh === 'nueva') { slugActual = ''; showEditor(null); }
    else if (hsh.startsWith('editar/')) {
      slugActual = hsh.slice(7);
      const p = pages.find(x => x.slug === slugActual);
      p ? showEditor(p) : showPage(slugActual);
    } else { slugActual = hsh || CONFIG.paginaInicio; showPage(slugActual); }
    renderNav();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  /* ---------- Menú móvil, búsqueda y atajos ---------- */
  $('#btn-menu').onclick = () => document.body.classList.add('menu');
  $('#backdrop').onclick = () => document.body.classList.remove('menu');
  $('#q').addEventListener('input', renderNav);
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
  });

  /* ---------- Inicio ---------- */
  (async function init() {
    $('#brand').textContent = CONFIG.nombre; $('#brand-m').textContent = CONFIG.nombre;
    const { data: { session } } = await sb.auth.getSession();
    setUser(session?.user || null);
    sb.auth.onAuthStateChange((_ev, s) => { setUser(s?.user || null); route(); setTimeout(async () => { await asegurarPerfil(); setUser(user); }, 0); });
    const ok = await cargar();
    if (!ok) return;
    await asegurarPerfil(); setUser(user);
    listo = true; route();
  })();
  </script>
</body>
</html>
